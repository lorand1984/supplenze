<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carica file - Gestione Supplenze</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #212529;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            color: #495057;
        }
        input[type="file"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            background-color: #fff;
        }
        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #2980b9;
        }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        .message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .link {
            text-align: center;
            margin-top: 20px;
        }
        .link a {
            color: #3498db;
            text-decoration: none;
        }
        .link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Gestione Supplenze</h1>
        <form id="uploadForm" enctype="multipart/form-data">
            <div class="form-group">
                <label for="orario">Orario Docenti (.xlsx) *</label>
                <input type="file" id="orario" name="orario" accept=".xlsx" required>
            </div>
            <div class="form-group">
                <label for="assenze">Assenze Docenti (.xlsx) *</label>
                <input type="file" id="assenze" name="assenze" accept=".xlsx" required>
            </div>
            <div class="form-group">
                <label for="visite">Visite di Istruzione (.xlsx, opzionale)</label>
                <input type="file" id="visite" name="visite" accept=".xlsx">
            </div>
            <button type="submit" id="submitBtn">Genera Sostituzioni</button>
        </form>
        <div id="message" class="message"></div>
        <div class="link">
            <a href="/visualizza">Visualizza ultime assegnazioni</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            messageDiv.style.display = 'none';
            messageDiv.className = 'message info';
            messageDiv.innerText = 'Elaborazione in corso...';
            messageDiv.style.display = 'block';

            const formData = new FormData(form);
            try {
                const response = await fetch('/genera-sostituzioni', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                if (response.ok) {
                    messageDiv.className = 'message success';
                    messageDiv.innerText = `✅ ${result.message}\nDocenti: ${result.stats.docenti}, Assenze: ${result.stats.assenze}, Visite: ${result.stats.visite}, Assegnazioni: ${result.stats.assegnazioni}`;
                    // Redirect after 2 seconds
                    setTimeout(() => {
                        window.location.href = '/visualizza';
                    }, 2000);
                } else {
                    messageDiv.className = 'message error';
                    messageDiv.innerText = `❌ Errore: ${result.error}`;
                }
            } catch (error) {
                messageDiv.className = 'message error';
                messageDiv.innerText = `❌ Errore di connessione: ${error.message}`;
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
