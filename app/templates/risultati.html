<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assegnazioni Supplenze</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 20px;
        }
        .container {
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow-x: auto;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .data-info {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.2em;
            font-weight: bold;
            color: #2c3e50;
        }
        .link {
            text-align: center;
            margin-bottom: 20px;
        }
        .link a {
            color: #3498db;
            text-decoration: none;
        }
        .model-selector {
            text-align: center;
            margin: 20px 0;
        }
        select, button {
            padding: 8px 12px;
            font-size: 14px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        select {
            width: 300px;
        }
        .loading, .error {
            text-align: center;
            margin: 20px;
            font-style: italic;
        }
        .error {
            color: red;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
            position: sticky;
            top: 0;
        }
        .empty {
            background-color: #fafafa;
            color: #ccc;
        }
        /* US20 / US26: elenchi in rosso */
        .assenze-list {
            color: #e74c3c;
            margin-top: 30px;
        }
        .assenze-list h3 {
            color: #e74c3c;
            margin-bottom: 8px;
        }
        .assenze-list ul {
            list-style-type: disc;
            padding-left: 25px;
            margin-top: 0;
        }
        .assenze-list li {
            margin: 4px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Assegnazioni Supplenze</h1>
        <div id="data-info" class="data-info"></div>
        <div class="link">
            <a href="/">← Carica nuovi file</a>
        </div>
        <div id="loading" class="loading">Caricamento in corso...</div>
        <div id="error" class="error" style="display:none;"></div>

        <div id="model-selector" class="model-selector" style="display:none;">
            <label for="modelSelect">Scegli il modello da visualizzare: </label>
            <select id="modelSelect"></select>
            <button id="loadModelBtn">Visualizza</button>
        </div>

        <div id="tabella-container" style="display:none;">
            <h3 id="model-title">Modello 1</h3>
            <table id="tabella">
                <thead id="tabella-head"></thead>
                <tbody id="tabella-body"></tbody>
            </table>
        </div>

        <!-- US20: assenze ignorate -->
        <div id="assenze-ignorate-container" class="assenze-list" style="display:none;">
            <h3>⚠️ Assenze ignorate (docente non in servizio)</h3>
            <ul id="assenze-ignorate-list"></ul>
        </div>

        <!-- US26: assenze senza necessità di sostituzione -->
        <div id="assenze-senza-supplenza-container" class="assenze-list" style="display:none;">
            <h3>ℹ️ Assenze senza necessità di sostituzione (preavviso ≥48h su prima/ultima ora)</h3>
            <ul id="assenze-senza-supplenza-list"></ul>
        </div>
    </div>

    <script>
        let modelli = [];      // array di modelli (ogni modello è un array di assegnazioni piatte)
        let maxOre = 7;        // configurabile

        function raggruppaPerDocente(assegnazioni) {
            const mappa = new Map();
            for (const a of assegnazioni) {
                const docente = a.docente_supplente;
                if (!mappa.has(docente)) {
                    mappa.set(docente, []);
                }
                mappa.get(docente).push({
                    ora: a.ora,
                    classe: a.classe,
                    docente_assente: a.docente_assente
                });
            }
            const gruppi = [];
            for (const [docente, supplenze] of mappa.entries()) {
                gruppi.push({
                    docente_supplente: docente,
                    supplenze: supplenze
                });
            }
            return gruppi;
        }

        async function caricaModelli() {
            try {
                const [modelliRes, infoRes, analisiRes] = await Promise.all([
                    fetch('/assegnazioni?all=true'),
                    fetch('/data_info'),
                    fetch('/assenze_senza_supplenza')
                ]);

                if (!modelliRes.ok) throw new Error('Errore nel caricamento dei modelli');
                modelli = await modelliRes.json();

                const info = await infoRes.json();
                if (info.data) {
                    document.getElementById('data-info').innerHTML =
                        `📅 Sostituzioni del giorno: <strong>${info.data}</strong>`;
                } else {
                    document.getElementById('data-info').innerHTML = '📅 Data non specificata';
                }

                document.getElementById('loading').style.display = 'none';

                // Popola selettore modelli (primi 100)
                if (modelli && modelli.length > 0) {
                    const select = document.getElementById('modelSelect');
                    select.innerHTML = '';
                    const maxModelli = Math.min(modelli.length, 100);
                    for (let i = 0; i < maxModelli; i++) {
                        const option = document.createElement('option');
                        option.value = i;
                        option.textContent = `Modello ${i + 1} (${modelli[i].length} supplenze)`;
                        select.appendChild(option);
                    }
                    document.getElementById('model-selector').style.display = 'block';
                    visualizzaModello(0);
                }

                // --- US20 / US26 ---
                const analisi = await analisiRes.json();

                const ignorateList = document.getElementById('assenze-ignorate-list');
                ignorateList.innerHTML = '';
                if (analisi.ignorate && analisi.ignorate.length > 0) {
                    analisi.ignorate.forEach(item => {
                        const li = document.createElement('li');
                        li.textContent = `${item.docente} – ${item.data} – ora ${item.ora}` +
                                         (item.classe ? ` – classe ${item.classe}` : '') +
                                         ` – ${item.motivo}`;
                        ignorateList.appendChild(li);
                    });
                    document.getElementById('assenze-ignorate-container').style.display = 'block';
                }

                const senzaList = document.getElementById('assenze-senza-supplenza-list');
                senzaList.innerHTML = '';
                if (analisi.senza_supplenza && analisi.senza_supplenza.length > 0) {
                    analisi.senza_supplenza.forEach(item => {
                        const li = document.createElement('li');
                        li.textContent = `${item.docente} – ${item.data} – ora ${item.ora}` +
                                         ` – classe ${item.classe} – ${item.motivo}`;
                        senzaList.appendChild(li);
                    });
                    document.getElementById('assenze-senza-supplenza-container').style.display = 'block';
                }

            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').innerText = 'Errore: ' + error.message;
            }
        }

        function visualizzaModello(indice) {
            const modelloPiatto = modelli[indice];
            if (!modelloPiatto) return;

            const gruppi = raggruppaPerDocente(modelloPiatto);
            document.getElementById('model-title').textContent =
                `Modello ${indice + 1} (${modelloPiatto.length} supplenze)`;

            const mappa = new Map();
            for (const gruppo of gruppi) {
                const docente = gruppo.docente_supplente;
                const supplenze = gruppo.supplenze;
                const ore = new Array(maxOre + 1).fill(null);
                for (const s of supplenze) {
                    const ora = s.ora;
                    if (ora >= 1 && ora <= maxOre) {
                        ore[ora] = `${s.classe} (${s.docente_assente})`;
                    }
                }
                mappa.set(docente, ore);
            }

            const docenti = Array.from(mappa.keys()).sort();

            const thead = document.getElementById('tabella-head');
            thead.innerHTML = '';
            const headerRow = document.createElement('tr');
            const thDocente = document.createElement('th');
            thDocente.textContent = 'Docente supplente';
            headerRow.appendChild(thDocente);
            for (let ora = 1; ora <= maxOre; ora++) {
                const th = document.createElement('th');
                th.textContent = `Ora ${ora}`;
                headerRow.appendChild(th);
            }
            thead.appendChild(headerRow);

            const tbody = document.getElementById('tabella-body');
            tbody.innerHTML = '';
            for (const docente of docenti) {
                const row = tbody.insertRow();
                const cellDocente = row.insertCell();
                cellDocente.textContent = docente;
                const ore = mappa.get(docente);
                for (let ora = 1; ora <= maxOre; ora++) {
                    const cell = row.insertCell();
                    const val = ore[ora];
                    if (val) {
                        cell.textContent = val;
                    } else {
                        cell.textContent = '';
                        cell.classList.add('empty');
                    }
                }
            }

            document.getElementById('tabella-container').style.display = 'block';
        }

        document.getElementById('loadModelBtn').addEventListener('click', () => {
            const select = document.getElementById('modelSelect');
            const idx = parseInt(select.value);
            visualizzaModello(idx);
        });

        caricaModelli();
    </script>
</body>
</html>
