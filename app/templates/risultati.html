<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assegnazioni Supplenze</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 20px;
        }
        .container {
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow-x: auto;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .data-info {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.2em;
            font-weight: bold;
            color: #2c3e50;
        }
        .link {
            text-align: center;
            margin-bottom: 20px;
        }
        .link a {
            color: #3498db;
            text-decoration: none;
        }
        .model-selector {
            text-align: center;
            margin: 20px 0;
        }
        select, button {
            padding: 8px 12px;
            font-size: 14px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        select {
            width: 300px;
        }
        .loading, .error {
            text-align: center;
            margin: 20px;
            font-style: italic;
        }
        .error {
            color: red;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
            position: sticky;
            top: 0;
        }
        .empty {
            background-color: #fafafa;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Assegnazioni Supplenze</h1>
        <div id="data-info" class="data-info"></div>
        <div class="link">
            <a href="/">← Carica nuovi file</a>
        </div>
        <div id="loading" class="loading">Caricamento in corso...</div>
        <div id="error" class="error" style="display:none;"></div>

        <div id="model-selector" class="model-selector" style="display:none;">
            <label for="modelSelect">Scegli il modello da visualizzare: </label>
            <select id="modelSelect"></select>
            <button id="loadModelBtn">Visualizza</button>
        </div>

        <div id="tabella-container" style="display:none;">
            <h3 id="model-title">Modello 1</h3>
            <table id="tabella">
                <thead id="tabella-head">
                    <!-- intestazioni generate da JS -->
                </thead>
                <tbody id="tabella-body">
                </tbody>
             </>
        </div>
    </div>

    <script>
        let modelli = [];      // array di modelli (ogni modello è un array di assegnazioni piatte)
        let maxOre = 7;        // configurabile

        // Funzione per raggruppare una lista piatta di assegnazioni per docente supplente
        function raggruppaPerDocente(assegnazioni) {
            const mappa = new Map();
            for (const a of assegnazioni) {
                const docente = a.docente_supplente;
                if (!mappa.has(docente)) {
                    mappa.set(docente, []);
                }
                mappa.get(docente).push({
                    ora: a.ora,
                    classe: a.classe,
                    docente_assente: a.docente_assente
                });
            }
            const gruppi = [];
            for (const [docente, supplenze] of mappa.entries()) {
                gruppi.push({
                    docente_supplente: docente,
                    supplenze: supplenze
                });
            }
            return gruppi;
        }

        async function caricaModelli() {
            try {
                const [modelliRes, infoRes] = await Promise.all([
                    fetch('/assegnazioni?all=true'),
                    fetch('/data_info')
                ]);
                if (!modelliRes.ok) throw new Error('Errore nel caricamento dei modelli');
                modelli = await modelliRes.json();
                const info = await infoRes.json();
                if (info.data) {
                    document.getElementById('data-info').innerHTML = `📅 Sostituzioni del giorno: <strong>${info.data}</strong>`;
                } else {
                    document.getElementById('data-info').innerHTML = '📅 Data non specificata';
                }
                document.getElementById('loading').style.display = 'none';

                if (!modelli || modelli.length === 0) {
                    document.getElementById('error').style.display = 'block';
                    document.getElementById('error').innerText = 'Nessun modello trovato.';
                    return;
                }

                // Popola il selettore con i primi 100 modelli (o tutti se meno)
                const select = document.getElementById('modelSelect');
                select.innerHTML = '';
                const maxModelli = Math.min(modelli.length, 100);
                for (let i = 0; i < maxModelli; i++) {
                    const option = document.createElement('option');
                    option.value = i;
                    option.textContent = `Modello ${i+1} (${modelli[i].length} supplenze)`;
                    select.appendChild(option);
                }
                document.getElementById('model-selector').style.display = 'block';

                // Mostra il primo modello di default
                visualizzaModello(0);
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').innerText = 'Errore: ' + error.message;
            }
        }

        function visualizzaModello(indice) {
            const modelloPiatto = modelli[indice];
            if (!modelloPiatto) return;

            // Raggruppa il modello piatto
            const gruppi = raggruppaPerDocente(modelloPiatto);
            document.getElementById('model-title').textContent = `Modello ${indice+1} (${modelloPiatto.length} supplenze)`;

            // Costruisce la mappa docente → array[1..maxOre]
            const mappa = new Map();
            for (const gruppo of gruppi) {
                const docente = gruppo.docente_supplente;
                const supplenze = gruppo.supplenze;
                const ore = new Array(maxOre + 1).fill(null);
                for (const s of supplenze) {
                    const ora = s.ora;
                    if (ora >= 1 && ora <= maxOre) {
                        ore[ora] = `${s.classe} (${s.docente_assente})`;
                    }
                }
                mappa.set(docente, ore);
            }

            const docenti = Array.from(mappa.keys()).sort();

            // Costruisce intestazione
            const thead = document.getElementById('tabella-head');
            thead.innerHTML = '';
            const headerRow = document.createElement('tr');
            const thDocente = document.createElement('th');
            thDocente.textContent = 'Docente supplente';
            headerRow.appendChild(thDocente);
            for (let ora = 1; ora <= maxOre; ora++) {
                const th = document.createElement('th');
                th.textContent = `Ora ${ora}`;
                headerRow.appendChild(th);
            }
            thead.appendChild(headerRow);

            // Costruisce corpo
            const tbody = document.getElementById('tabella-body');
            tbody.innerHTML = '';
            for (const docente of docenti) {
                const row = tbody.insertRow();
                const cellDocente = row.insertCell();
                cellDocente.textContent = docente;
                const ore = mappa.get(docente);
                for (let ora = 1; ora <= maxOre; ora++) {
                    const cell = row.insertCell();
                    const val = ore[ora];
                    if (val) {
                        cell.textContent = val;
                    } else {
                        cell.textContent = '';
                        cell.classList.add('empty');
                    }
                }
            }

            document.getElementById('tabella-container').style.display = 'block';
        }

        // Evento per il pulsante di visualizzazione
        document.getElementById('loadModelBtn').addEventListener('click', () => {
            const select = document.getElementById('modelSelect');
            const idx = parseInt(select.value);
            visualizzaModello(idx);
        });

        caricaModelli();
    </script>
</body>
</html>
