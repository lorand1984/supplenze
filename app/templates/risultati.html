<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assegnazioni Supplenze</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 20px;
        }
        .container {
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow-x: auto;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .link {
            text-align: center;
            margin-bottom: 20px;
        }
        .link a {
            color: #3498db;
            text-decoration: none;
        }
        .loading, .error {
            text-align: center;
            margin: 20px;
            font-style: italic;
        }
        .error {
            color: red;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
            position: sticky;
            top: 0;
        }
        .empty {
            background-color: #fafafa;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Assegnazioni Supplenze</h1>
        <div class="link">
            <a href="/">← Carica nuovi file</a>
        </div>
        <div id="loading" class="loading">Caricamento in corso...</div>
        <div id="error" class="error" style="display:none;"></div>
        <div id="tabella-container" style="display:none;">
            <table id="tabella">
                <thead id="tabella-head">
                    <!-- intestazioni inserite da JavaScript -->
                </thead>
                <tbody id="tabella-body">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function carica() {
            try {
                const response = await fetch('/assegnazioni');
                if (!response.ok) throw new Error('Errore nel caricamento dei dati');
                const data = await response.json();
                document.getElementById('loading').style.display = 'none';
                if (!data || data.length === 0) {
                    document.getElementById('error').style.display = 'block';
                    document.getElementById('error').innerText = 'Nessuna assegnazione trovata.';
                    return;
                }

                // Definisce il numero massimo di ore (configurabile, qui 7)
                const maxOre = 7;

                // Crea una mappa: docente_supplente -> array di supplenze per ora (indice 1..7)
                const mappa = new Map();
                for (const gruppo of data) {
                    const docente = gruppo.docente_supplente;
                    const supplenze = gruppo.supplenze;
                    // Inizializza un array di 7 posizioni vuote (indice 1-7)
                    const ore = new Array(maxOre + 1).fill(null);
                    for (const s of supplenze) {
                        const ora = s.ora;
                        if (ora >= 1 && ora <= maxOre) {
                            ore[ora] = `${s.classe} (${s.docente_assente})`;
                        }
                    }
                    mappa.set(docente, ore);
                }

                // Ottieni la lista dei docenti (ordinata)
                const docenti = Array.from(mappa.keys()).sort();

                // Costruisce l'intestazione
                const thead = document.getElementById('tabella-head');
                const headerRow = document.createElement('tr');
                const thDocente = document.createElement('th');
                thDocente.textContent = 'Docente supplente';
                headerRow.appendChild(thDocente);
                for (let ora = 1; ora <= maxOre; ora++) {
                    const th = document.createElement('th');
                    th.textContent = `Ora ${ora}`;
                    headerRow.appendChild(th);
                }
                thead.appendChild(headerRow);

                // Costruisce il corpo
                const tbody = document.getElementById('tabella-body');
                for (const docente of docenti) {
                    const row = tbody.insertRow();
                    const cellDocente = row.insertCell();
                    cellDocente.textContent = docente;
                    const ore = mappa.get(docente);
                    for (let ora = 1; ora <= maxOre; ora++) {
                        const cell = row.insertCell();
                        const val = ore[ora];
                        if (val) {
                            cell.textContent = val;
                        } else {
                            cell.textContent = '';
                            cell.classList.add('empty');
                        }
                    }
                }

                document.getElementById('tabella-container').style.display = 'block';
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').innerText = 'Errore: ' + error.message;
            }
        }
        carica();
    </script>
</body>
</html>
